<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="50%" style="stop-color:#111842"/>
      <stop offset="100%" style="stop-color:#0d1333"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00d4ff" flood-opacity="0.3"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Ambient glow orbs -->
  <circle cx="200" cy="120" r="120" fill="#00d4ff" opacity="0.08" filter="url(#blur1)"/>
  <circle cx="900" cy="300" r="150" fill="#7c3aed" opacity="0.1" filter="url(#blur1)"/>
  <circle cx="600" cy="80" r="80" fill="#00d4ff" opacity="0.05" filter="url(#blur2)"/>

  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#00d4ff" stroke-width="0.5" fill="none">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
  </g>

  <!-- Floating code nodes (connected graph) -->
  <g opacity="0.4">
    <!-- Node connections -->
    <line x1="160" y1="140" x2="280" y2="100" stroke="url(#accent)" stroke-width="1" opacity="0.5"/>
    <line x1="280" y1="100" x2="400" y2="160" stroke="url(#accent)" stroke-width="1" opacity="0.5"/>
    <line x1="400" y1="160" x2="520" y2="90" stroke="url(#accent)" stroke-width="1" opacity="0.5"/>
    <line x1="520" y1="90" x2="640" y2="130" stroke="url(#accent)" stroke-width="1" opacity="0.5"/>
    <line x1="640" y1="130" x2="750" y2="80" stroke="url(#accent)" stroke-width="1" opacity="0.4"/>
    <line x1="160" y1="140" x2="200" y2="250" stroke="url(#accent)" stroke-width="1" opacity="0.3"/>
    <line x1="750" y1="80" x2="850" y2="180" stroke="url(#accent)" stroke-width="1" opacity="0.3"/>

    <!-- Nodes -->
    <circle cx="160" cy="140" r="6" fill="#00d4ff" opacity="0.8"/>
    <circle cx="280" cy="100" r="8" fill="#00d4ff" opacity="0.9"/>
    <circle cx="400" cy="160" r="5" fill="#7c3aed" opacity="0.8"/>
    <circle cx="520" cy="90" r="7" fill="#00d4ff" opacity="0.7"/>
    <circle cx="640" cy="130" r="6" fill="#7c3aed" opacity="0.8"/>
    <circle cx="750" cy="80" r="9" fill="#00d4ff" opacity="0.9"/>
    <circle cx="850" cy="180" r="5" fill="#7c3aed" opacity="0.6"/>
    <circle cx="200" cy="250" r="4" fill="#00d4ff" opacity="0.5"/>
  </g>

  <!-- Code editor mockup (left side) -->
  <g transform="translate(80, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="240" rx="8" fill="#0f1428" stroke="#1e2a4a" stroke-width="1" opacity="0.9"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="340" height="28" rx="8" fill="#151b33"/>
    <rect x="0" y="20" width="340" height="8" fill="#151b33"/>
    <circle cx="16" cy="14" r="4" fill="#ff5f57"/>
    <circle cx="30" cy="14" r="4" fill="#febc2e"/>
    <circle cx="44" cy="14" r="4" fill="#28c840"/>
    <text x="140" y="18" font-family="monospace" font-size="10" fill="#6b7280" text-anchor="middle">App.tsx</text>
    <!-- Code lines -->
    <g font-family="monospace" font-size="11">
      <text x="16" y="52" fill="#7c3aed">import</text>
      <text x="68" y="52" fill="#00d4ff">{ ToastProvider }</text>
      <text x="170" y="52" fill="#7c3aed">from</text>
      <text x="198" y="52" fill="#28c840">'./ui/Toast'</text>
      <text x="16" y="72" fill="#7c3aed">export default</text>
      <text x="128" y="72" fill="#00d4ff">function</text>
      <text x="178" y="72" fill="#febc2e">App</text>
      <text x="16" y="92" fill="#6b7280">  return (</text>
      <text x="16" y="112" fill="#6b7280">    &lt;</text>
      <text x="40" y="112" fill="#00d4ff">ToastProvider</text>
      <text x="132" y="112" fill="#6b7280">&gt;</text>
      <text x="16" y="132" fill="#6b7280">      &lt;</text>
      <text x="40" y="132" fill="#00d4ff">ChatView</text>
      <text x="112" y="132" fill="#6b7280">/&gt;</text>
      <text x="16" y="152" fill="#6b7280">      &lt;</text>
      <text x="40" y="152" fill="#00d4ff">Sidebar</text>
      <text x="102" y="152" fill="#6b7280">/&gt;</text>
      <text x="16" y="172" fill="#6b7280">    &lt;/</text>
      <text x="46" y="172" fill="#00d4ff">ToastProvider</text>
      <text x="148" y="172" fill="#6b7280">&gt;</text>
      <text x="16" y="192" fill="#6b7280">  )</text>
    </g>
    <!-- Line numbers -->
    <g font-family="monospace" font-size="9" fill="#3b4261">
      <text x="8" y="52">1</text>
      <text x="8" y="72">2</text>
      <text x="8" y="92">3</text>
      <text x="8" y="112">4</text>
      <text x="8" y="132">5</text>
      <text x="8" y="152">6</text>
      <text x="8" y="172">7</text>
      <text x="8" y="192">8</text>
    </g>
  </g>

  <!-- Chat bubble (right side) -->
  <g transform="translate(500, 140)" filter="url(#shadow)">
    <!-- User message -->
    <rect x="180" y="0" width="220" height="40" rx="12" fill="#1e3a5f" opacity="0.9"/>
    <text x="200" y="25" font-family="sans-serif" font-size="12" fill="#e2e8f0">帮我重构这个组件...</text>
    <!-- AI response -->
    <rect x="0" y="60" width="350" height="56" rx="12" fill="#0f1428" stroke="#1e2a4a" stroke-width="0.5" opacity="0.9"/>
    <circle cx="20" cy="80" r="8" fill="#00d4ff" opacity="0.3"/>
    <text x="16" y="84" font-family="monospace" font-size="10" fill="#00d4ff">AI</text>
    <text x="36" y="84" font-family="sans-serif" font-size="11" fill="#94a3b8">已将 useState 迁移到 Zustand store，</text>
    <text x="36" y="102" font-family="sans-serif" font-size="11" fill="#94a3b8">并添加了 TypeScript 类型定义 ✨</text>
    <!-- Typing indicator -->
    <g transform="translate(0, 136)">
      <rect x="0" y="0" width="80" height="28" rx="12" fill="#0f1428" stroke="#1e2a4a" stroke-width="0.5" opacity="0.7"/>
      <circle cx="24" cy="14" r="3" fill="#00d4ff" opacity="0.6">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="14" r="3" fill="#00d4ff" opacity="0.6">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="56" cy="14" r="3" fill="#00d4ff" opacity="0.6">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Terminal bar (bottom) -->
  <g transform="translate(80, 290)">
    <rect x="0" y="0" width="900" height="80" rx="8" fill="#0a0e1a" stroke="#1e2a4a" stroke-width="1" opacity="0.85"/>
    <rect x="0" y="0" width="900" height="24" rx="8" fill="#111827"/>
    <rect x="0" y="16" width="900" height="8" fill="#111827"/>
    <circle cx="14" cy="12" r="3.5" fill="#ff5f57"/>
    <circle cx="26" cy="12" r="3.5" fill="#febc2e"/>
    <circle cx="38" cy="12" r="3.5" fill="#28c840"/>
    <text x="180" y="16" font-family="monospace" font-size="10" fill="#6b7280">Terminal — mimocode-webui</text>
    <!-- Terminal content -->
    <g font-family="monospace" font-size="11">
      <text x="16" y="44" fill="#28c840">$</text>
      <text x="28" y="44" fill="#e2e8f0">npm run dev</text>
      <text x="140" y="44" fill="#6b7280">✓ built in 3.80s</text>
      <text x="16" y="62" fill="#28c840">$</text>
      <text x="28" y="62" fill="#e2e8f0">git push origin main</text>
      <text x="200" y="62" fill="#00d4ff">→ github.com/xkpforever/mimocode-webui</text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#accent)" opacity="0.6"/>
</svg>
